// width = max(world width, pixel width)

// ---------- camera: one continuous move, keys [t, [log distance km, pitch°, yaw°, lon, lat, height km]] ----------
// 开场直接全屏地形（用户 2026-11-20：不要 800 km 俯冲过渡——像图片、缺地形厚重感）；0–10 s 为极慢推近 130→122 km

  [0.0, [Math.log(130), 48, 0, 109.00, 34.30, 0]],
  [10.0, [Math.log(122), 48, 0, 109.00, 34.30, 0]],
  [18.0, [Math.log(210), 50, 0, 109.05, 34.32, 0]],
  [21.0, [Math.log(35), 20, 0, 109.20, 34.36, 0]],

const LABELS = [

function dateBlock(t) {
  const a = ss(seg(t, .5, 1.5)); if (a <= 0) return;
  txt('前771年', Wd - 96, 72, { size: 40, w: 700, sp: 4, align: 'right', col: C.light, a, id: 'date' });
  txt('传统纪年', Wd - 96, 112, { size: 18, w: 500, sp: 6, align: 'right', col: C.amberSoft, a, id: 'date-sub' });
  line([[Wd - 96 - tw('前771年', 40, 700, 4), 138], [Wd - 96, 138]], 'rgba(255,214,150,.6)', 1.2, a);
}

// the text flag above Fenghao: 周 (blue) → 犬戎 (red), crossfade 24–27 s
function flag(t) {
  const [fx, fy, fz] = scr(geo(...FENGHAO, .4)); if (fz > 1) return;
  const aIn = ss(seg(t, 1.0, 2.0)) * (1 - ss(seg(t, 46.0, 48.0)));   // fades out 46–48 s so it never clashes with the ending card
  const aZhou = aIn * (1 - ss(seg(t, 24.0, 27.0)));
  const aRong = aIn * ss(seg(t, 24.0, 27.0));
  if (aZhou <= .01 && aRong <= .01) return;
  const poleTop = fy - 78;
  line([[fx, fy], [fx, poleTop]], 'rgba(246,238,224,.9)', 2, Math.max(aZhou, aRong));
  for (const [txtS, col, a] of [['周', C.blue, aZhou], ['犬戎', C.redDeep, aRong]]) {
    if (a <= .01) continue;
    const w = tw(txtS, 30, 700, 4) + 28, h = 42;
    rect(fx + 2, poleTop - h + 4, w, h, col, a);
    txt(txtS, fx + 2 + w / 2, poleTop - h / 2 + 5, { size: 30, w: 700, sp: 4, col: '#ffffff', a, id: 'flag-' + txtS });
  }
  // the city marker dims when the city falls (24–27 s)
  const dim = 1 - .55 * ss(seg(t, 24.0, 27.0));
  dot(fx, fy, 4.5, C.amber, Math.max(aZhou, aRong) * dim);
}

// coalition nameplate at the arrow tip + the "示意" tag on the arrow
function arrowMarks(t) {
  const a = ss(seg(t, 10.5, 11.5)) * (1 - ss(seg(t, 17.0, 18.0))); if (a <= .01) return;
  const tip = arrowPts[arrowPts.length - 1];
  const [tx, ty, tz] = scr(tip); if (tz < 1) {
    dot(tx, ty, 4, C.red, a);
    txt('申侯联军', tx + 46, ty - 34, { size: 24, w: 700, sp: 4, align: 'left', col: C.red, a, id: 'np' });
  }
  const mid = arrowPts[Math.floor(arrowPts.length * .45)];
  const [mx, my, mz] = scr(mid); if (mz < 1) {
    txt('示意', mx, my + 44, { size: 18, w: 600, sp: 4, col: 'rgba(240,232,216,.85)', a, id: 'shi-yi' });
  }
}

// battle glow at Mount Li, 18–24 s (restrained: a pulsing glow, no buildings, no burning)
function battleGlow(t) {
  const a = ss(seg(t, 18.0, 18.8)) * (1 - ss(seg(t, 23.2, 24.0))); if (a <= .01) return;
  const [x, y, z] = scr(geo(...LISHAN, .6)); if (z > 1) return;
  const pulse = .75 + .25 * Math.sin(t * 6.0);
  const R = 150 * pulse;
  const gr = g.createRadialGradient(x, y, 4, x, y, R);
  gr.addColorStop(0, `rgba(255,110,60,${.55 * a})`); gr.addColorStop(.45, `rgba(255,80,40,${.28 * a})`); gr.addColorStop(1, 'rgba(255,80,40,0)');
  g.save(); g.globalAlpha = 1; g.fillStyle = gr; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill(); g.restore();
  dot(x, y, 5, '#ffd9a0', a);
}

// intelligence card, right side, 10–18 s (proven facts only, no numbers)
function intelCard(t) {
  const a = ss(seg(t, 10.0, 11.0)) * (1 - ss(seg(t, 18.0, 19.0))); if (a <= .01) return;
  const X = 1330, Y = 150, W = 550, H = 250;
  g.save(); g.globalAlpha = a;
  g.fillStyle = 'rgba(8,10,14,.88)'; g.beginPath(); g.roundRect(X, Y, W, H, 6); g.fill();
  g.strokeStyle = '#ff4a3d'; g.lineWidth = 3;
  const c = 22;
  g.beginPath();
  g.moveTo(X, Y + c); g.lineTo(X, Y); g.lineTo(X + c, Y);
  g.moveTo(X + W - c, Y); g.lineTo(X + W, Y); g.lineTo(X + W, Y + c);
  g.moveTo(X + W, Y + H - c); g.lineTo(X + W, Y + H); g.lineTo(X + W - c, Y + H);
  g.moveTo(X + c, Y + H); g.lineTo(X, Y + H); g.lineTo(X, Y + H - c);
  g.stroke(); g.restore();
  txt('敌情判断', X + 28, Y + 48, { size: 28, w: 700, sp: 6, align: 'left', col: '#ff6a55', a, id: 'intel-t' });
  txt('申侯、缯、犬戎联军', X + 28, Y + 122, { size: 26, w: 500, sp: 2, align: 'left', col: C.light, a, id: 'intel-1' });
  txt('攻周', X + 28, Y + 172, { size: 26, w: 500, sp: 2, align: 'left', col: C.light, a, id: 'intel-2' });
}

// 洛邑 marker + label at the eastward route's end (44–56 s). The marker shows the direction/destination;
// true 洛邑 (~112.45°E) lies beyond this map's eastern edge (111.0°E) — see FACTS.md §5.
function eastMarks(t) {
  const a = ss(seg(t, 44.0, 48.0)) * (1 - ss(seg(t, 56.0, 60.0)));
  if (a <= .01) return;
  const [x, y, z] = scr(geo(...LUOYI, .4));
  if (z > 1) return;
  dot(x, y, 4.5, C.amber, a);
  txt('洛邑', x, y - 34, { size: 26, w: 700, sp: 4, col: '#ffffff', stroke: 'rgba(26,18,11,.9)', sw: 4, a, id: 'luoyi' });
  txt('东迁至此', x, y + 30, { size: 18, w: 500, sp: 2, col: C.amberSoft, a, id: 'luoyi-sub' });
}

// ending card (48–60 s): "西周终结 · 第一场"
function endingCard(t) {
  const a = ss(seg(t, 48.0, 49.5)) * (1 - ss(seg(t, 58.5, 60.0)));
  if (a <= .01) return;
  const W = 640, H = 190, X = (Wd - W) / 2, Y = (Ht - H) / 2 - 40;
  g.save(); g.globalAlpha = a;
  g.fillStyle = 'rgba(8,10,14,.88)'; g.beginPath(); g.roundRect(X, Y, W, H, 6); g.fill();
  g.strokeStyle = '#ffc36b'; g.lineWidth = 2; g.stroke();
  g.restore();
  txt('西周终结', Wd / 2, Y + 78, { size: 54, w: 700, sp: 10, col: C.light, a, id: 'end-t' });
  txt('第一场', Wd / 2, Y + 142, { size: 26, w: 500, sp: 6, col: C.amberSoft, a, id: 'end-sub' });
}

// subtitles: Chinese only, bottom-left legend shelf
function subtitles(t) {
  const c = CUES.find(c => t >= c.t0 - .12 && t < c.t1 + .12);
  g.save(); const gr = g.createLinearGradient(0, Ht - 250, 0, Ht); gr.addColorStop(0, 'rgba(6,10,15,0)'); gr.addColorStop(1, 'rgba(6,10,15,.55)');
  g.fillStyle = gr; g.fillRect(0, Ht - 250, Wd, 250); g.restore();
  if (!c) return;
  const a = ss(seg(t, c.t0 - .12, c.t0 + .08)) * (1 - ss(seg(t, c.t1 - .08, c.t1 + .12)));
  const X = 96, Y = Ht - 104;
  g.save(); g.globalAlpha = a; g.fillStyle = C.amber; g.fillRect(X - 22, Y - 22, 3, 74); g.restore();
  txt(c.zh, X, Y, { size: 36, w: 500, sp: 1.5, f: 'NotoSC', align: 'left', col: C.light, a, id: 'sub' });
}

function credits(t) {
  const a = ss(seg(t, .6, 1.4));
  txt('地形 AWS TERRAIN TILES · 影像 SENTINEL-2 CLOUDLESS 2016（EOX，CC BY 4.0）· 路线为示意 · 地形夸大 ×3.2',
    Wd - 40, Ht - 26, { size: 12, w: 500, sp: 1, align: 'right', col: 'rgba(240,232,216,.55)', base: 'alphabetic', a, id: 'credits', nobox: true });
}

// ---------- the frame at film time t ----------
function frame(t) {
  TX = [];
  const dist = setCamera(t);
  g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, Wd, Ht);
  // the arrow: reveal 10–13 s, hold, fade 18–20 s
  const k = eio(seg(t, 10.0, 13.0));
  const head = k * arrow.glow.L;
  const inten = ss(seg(t, 10.0, 10.4)) * (1 - ss(seg(t, 18.0, 20.0)));
  for (const r of [arrow.glow, arrow.core]) rv(r, { revB: head, head, headAmt: 1.1 * (1 - ss(seg(k, .8, 1))), inten, flowPh: t * 26, soft: 6 });
  // the eastward route: reveal 30–38 s, hold, fade 54–58 s
  const ek = eio(seg(t, 30.0, 38.0));
  const ehead = ek * east.glow.L;
  const einten = ss(seg(t, 30.0, 30.4)) * (1 - ss(seg(t, 54.0, 58.0)));
  for (const r of [east.glow, east.core]) rv(r, { revB: ehead, head: ehead, headAmt: 1.1 * (1 - ss(seg(ek, .8, 1))), inten: einten, flowPh: t * 26, soft: 6 });
  post.dof.focus = dist; post.dof.aper = dist * lerp(3.5, 10.5, ss(seg(t, 6.0, 12.0)));
  if (t >= 18 && t < 24.6) post.dof.aper = dist * 16;
  VU.fade.value = 1;
  post.composer.render();
  // overlay, in order
  mapLabels(t); titleBlock(t); dateBlock(t); flag(t); battleGlow(t); arrowMarks(t); intelCard(t); eastMarks(t); endingCard(t);
  if (!Q.has('nosubs')) subtitles(t);
  credits(t);
}

window.DUR = DUR;
window.render = t => frame(t);
// TEXTS returns the text boxes of the most recent render(t) (readcheck renders first, then reads TEXTS).
window.TEXTS = t => TX.map(o => ({ ...o }));
window.render(0);
window.READY = true;
</script>
